name: hermes-ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HERMES_TEST_MODE: "1"
      IDENTITY_MAP_SECRET: hermes-test-mode-secret-not-for-prod
      HERMES_JWT_SECRET: hermes-test-jwt-secret-32chars!!
      HERMES_DB_PATH: data/hermes.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python
        run: pip install -e ".[dev]"
      - name: Ingest fixtures
        run: python -m scripts.ingest_fixtures
      - name: Tests
        run: pytest
      - name: Verify audit chain
        run: python scripts/verify_audit_chain.py --db data/hermes.db
      - name: Leakage audit
        run: python -m scripts.leakage_audit
      - name: Fairness audit
        run: python -m scripts.fairness_audit
      - name: Coverage report
        run: python -m scripts.coverage_report
      - name: Dashboard export smoke
        run: python -m scripts.dashboard_export
      - name: Query smoke
        run: python -m scripts.hermes_query staff --skills container_orchestration --level 3
      - name: Install web
        working-directory: web
        run: npm ci
      - name: Build web
        working-directory: web
        run: npm run build
