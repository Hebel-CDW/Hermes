  - skill_id: aws_compute
    name: AWS Compute
    description: EC2, autoscaling, and core AWS compute operations.
    ticket_keywords:
    - aws
    - ec2
    - aws compute
    - aws basics
    cert_codes:
    - AWS-SAA
    - AWS-SOA
    proficiency_levels: &id001
    - level: 1
      label: Awareness
      behavioural_definition: Can describe core concepts and recognize when the skill
        applies.
    - level: 2
      label: Working
      behavioural_definition: Completes routine tasks with guidance; applies the skill
        in standard scenarios.
    - level: 3
      label: Proficient
      behavioural_definition: Independently delivers production work; troubleshoots
        common failures.
    - level: 4
      label: Advanced
      behavioural_definition: Designs solutions, mentors others, and handles non-standard
        incidents.
    - level: 5
      label: Expert
      behavioural_definition: Sets standards, leads complex programmes, and is a recognised
        organisational authority.
    decay_class: medium
    related_skills: []
